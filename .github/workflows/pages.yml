# Publica la web en GitHub Pages cada vez que se publica una versión (Release).
# La web va dentro de la versión como "web.zip"; aquí se descomprime y se publica tal cual.
name: Publicar web

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Descargar la web de la última versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # La versión exacta: la del evento, o la más reciente de la lista (la API de "latest" a veces tarda en actualizarse)
          TAG="${{ github.event.release.tag_name }}"
          if [ -z "$TAG" ]; then TAG=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1 --exclude-drafts --exclude-pre-releases --json tagName --jq '.[0].tagName'); fi
          echo "Publicando la web de $TAG"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern web.zip --dir .
          mkdir sitio
          unzip -q web.zip -d sitio
      - uses: actions/upload-pages-artifact@v3
        with:
          path: sitio
      - id: despliegue
        uses: actions/deploy-pages@v4